<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Orders — Velora Market</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/animations.css">
<style>
.order-card{background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-4);box-shadow:var(--shadow-sm);cursor:pointer;transition:all var(--transition-base)}
.order-card:hover{box-shadow:var(--shadow-lg);border-color:var(--color-secondary);transform:translateY(-2px)}
.order-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3)}
.order-id{font-family:var(--font-mono);font-weight:700;color:var(--color-accent);font-size:var(--text-sm)}
.order-items-preview{display:flex;gap:var(--space-2);align-items:center}
.order-item-thumb{width:48px;height:48px;border-radius:var(--radius-md);object-fit:cover;background:var(--color-surface);display:flex;align-items:center;justify-content:center;font-size:1.2rem;border:2px solid var(--color-border)}
.status-map{PENDING:'badge-warning',CONFIRMED:'badge-accent',PROCESSING:'badge-accent',SHIPPED:'badge-accent',DELIVERED:'badge-success',CANCELLED:'badge-error',REFUNDED:'badge-gray'}
</style>
</head>
<body>
<nav class="nav" id="main-nav">
<div class="nav-inner">
<a href="index.html" class="nav-logo"><div class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></div><span class="logo-text">Velora<span>Market</span></span></a>
<div class="nav-actions"><a href="cart.html" class="nav-icon-btn nav-cart-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg><span class="cart-count" id="cart-count" style="display:none">0</span></a><div id="nav-user-area"><a href="login.html" class="btn btn-secondary btn-sm">Login</a></div></div>
</div>
</nav>
<div class="container" style="padding-top:var(--space-8);padding-bottom:var(--space-12)">
<div class="page-header"><div><h1>My Orders</h1><p>Track and manage all your purchases</p></div><a href="shop.html" class="btn btn-primary">Continue Shopping</a></div>
<div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-6);flex-wrap:wrap">
<button class="btn btn-secondary btn-sm active-filter" onclick="filterOrders('all',this)">All Orders</button>
<button class="btn btn-ghost btn-sm" onclick="filterOrders('PENDING',this)">Pending</button>
<button class="btn btn-ghost btn-sm" onclick="filterOrders('SHIPPED',this)">Shipped</button>
<button class="btn btn-ghost btn-sm" onclick="filterOrders('DELIVERED',this)">Delivered</button>
<button class="btn btn-ghost btn-sm" onclick="filterOrders('CANCELLED',this)">Cancelled</button>
</div>
<div id="orders-list"></div>
</div>
<!-- Order Detail Modal -->
<div class="modal-overlay" id="order-modal">
<div class="modal modal-lg">
<div class="modal-header"><h3>Order Details</h3><button class="modal-close" onclick="closeModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<div class="modal-body" id="modal-body"></div>
</div>
</div>
<div class="toast-container" id="toast-container"></div>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/socket.js"></script>
<script>
window.addEventListener('scroll',()=>document.getElementById('main-nav').classList.toggle('scrolled',window.scrollY>10));
Auth.requireAuth('BUYER');
let allOrders=[];
const STATUS_BADGE={PENDING:'badge-warning',CONFIRMED:'badge-accent',PROCESSING:'badge-accent',SHIPPED:'badge-accent',DELIVERED:'badge-success',CANCELLED:'badge-error',REFUNDED:'badge-gray'};
const STATUS_ICON={PENDING:'⏳',CONFIRMED:'✅',PROCESSING:'⚙️',SHIPPED:'🚚',DELIVERED:'📦',CANCELLED:'❌',REFUNDED:'↩️'};
const STEPS=['PENDING','CONFIRMED','PROCESSING','SHIPPED','DELIVERED'];
function money(cents){return ((Number(cents)||0)/100).toLocaleString('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:2,maximumFractionDigits:2});}
async function loadOrders(){
  const list=document.getElementById('orders-list');
  list.innerHTML=`<div style="display:flex;flex-direction:column;gap:var(--space-4)">${Array(3).fill('<div class="skeleton" style="height:100px;border-radius:var(--radius-lg)"></div>').join('')}</div>`;
  try{
    const res=await API.get('/api/orders');
    if(res?.success&&res.data?.length){allOrders=res.data;renderOrders(allOrders);}
    else renderFallback();
  }catch{renderFallback();}
}
function renderFallback(){
  allOrders=[];
  renderOrders(allOrders);
}
function renderOrders(orders){
  const list=document.getElementById('orders-list');
  if(!orders.length){list.innerHTML=`<div class="empty-state"><div class="empty-icon">📦</div><h3>No orders found</h3><p>You haven't placed any orders yet.</p><a href="shop.html" class="btn btn-primary btn-lg" style="margin-top:1rem">Start Shopping</a></div>`;return;}
  list.innerHTML=orders.map(o=>`
    <div class="order-card animate-fadeUp" onclick="openOrder('${o.id}')">
      <div class="order-header">
        <div><span class="order-id">#${o.id.slice(-12).toUpperCase()}</span><div style="font-size:var(--text-xs);color:var(--color-text-sec);margin-top:2px">${new Date(o.createdAt).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div></div>
        <span class="badge ${STATUS_BADGE[o.status]||'badge-gray'}">${STATUS_ICON[o.status]} ${o.status}</span>
      </div>
      <div class="order-items-preview">
        ${(o.items||[]).slice(0,3).map(i=>`<div class="order-item-thumb">${i.image?`<img src="${i.image}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">`:i.emoji||'🛍️'}</div>`).join('')}
        ${(o.items||[]).length>3?`<div style="font-size:var(--text-xs);color:var(--color-text-sec)">+${o.items.length-3} more</div>`:''}
        <div style="margin-left:auto;font-family:var(--font-mono);font-weight:700;color:var(--color-text);font-size:var(--text-lg)">${money(o.total)}</div>
      </div>
      ${o.status==='SHIPPED'?`<div style="margin-top:var(--space-3);padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);font-size:var(--text-xs);display:flex;align-items:center;gap:var(--space-2)"><span>🚚</span><span>Tracking: <strong>${o.trackingNumber||'N/A'}</strong></span></div>`:''}
    </div>`).join('');
}
function filterOrders(status,btn){
  document.querySelectorAll('.active-filter').forEach(b=>b.classList.remove('active-filter','btn-secondary'));
  document.querySelectorAll('.active-filter').forEach(b=>b.classList.add('btn-ghost'));
  btn.classList.add('active-filter','btn-secondary');btn.classList.remove('btn-ghost');
  renderOrders(status==='all'?allOrders:allOrders.filter(o=>o.status===status));
}
function openOrder(id){
  const o=allOrders.find(x=>x.id===id);
  if(!o)return;
  const stepIdx=STEPS.indexOf(o.status);
  document.getElementById('modal-body').innerHTML=`
    <div style="margin-bottom:var(--space-5)">
      <div style="display:flex;justify-content:space-between;margin-bottom:var(--space-2)"><span style="font-family:var(--font-mono);font-size:var(--text-sm)">Order #${o.id.slice(-12).toUpperCase()}</span><span class="badge ${STATUS_BADGE[o.status]}">${o.status}</span></div>
      <div style="font-size:var(--text-sm);color:var(--color-text-sec)">Placed ${new Date(o.createdAt).toLocaleDateString()}</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-bottom:var(--space-6)">${STEPS.map((s,i)=>`<div style="flex:1;text-align:center;position:relative"><div style="width:32px;height:32px;border-radius:50%;margin:0 auto var(--space-2);display:flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:700;${i<=stepIdx?'background:var(--color-accent);color:#fff':'background:var(--color-border);color:var(--color-text-sec)'}">${i<stepIdx?'✓':i+1}</div><div style="font-size:10px;color:${i<=stepIdx?'var(--color-accent)':'var(--color-text-sec)'};font-weight:600">${s}</div>${i<STEPS.length-1?`<div style="position:absolute;top:16px;left:60%;width:80%;height:2px;background:${i<stepIdx?'var(--color-accent)':'var(--color-border)'}"></div>`:''}</div>`).join('')}</div>
    <h4 style="margin-bottom:var(--space-3)">Items</h4>
    ${(o.items||[]).map(i=>`<div style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--color-border)"><div style="width:48px;height:48px;background:var(--color-surface);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:1.5rem">${i.emoji||'🛍️'}</div><div style="flex:1"><div style="font-weight:600;font-size:var(--text-sm)">${i.name}</div><div style="font-size:var(--text-xs);color:var(--color-text-sec)">${i.vendorName} · Qty: ${i.quantity}</div></div><div style="font-family:var(--font-mono);font-weight:700">${money((i.price||0)*i.quantity)}</div></div>`).join('')}
    <div style="margin-top:var(--space-4);padding-top:var(--space-4);border-top:2px solid var(--color-border);text-align:right"><strong style="font-family:var(--font-mono);font-size:var(--text-xl)">Total: ${money(o.total)}</strong></div>
  `;
  document.getElementById('order-modal').classList.add('open');
}
function closeModal(){document.getElementById('order-modal').classList.remove('open');}
document.getElementById('order-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
// Real-time order updates
window.addEventListener('order:updated',e=>{
  const {orderId,status}=e.detail;
  const o=allOrders.find(x=>x.id===orderId);
  if(o){o.status=status;renderOrders(allOrders);}
});
loadOrders();
</script>
</body>
</html>
